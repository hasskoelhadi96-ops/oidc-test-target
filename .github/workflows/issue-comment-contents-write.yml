name: issue_comment contents write test
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
jobs:
  contents-write-test:
    runs-on: ubuntu-latest
    steps:
      - name: Show context
        run: |
          echo "actor: $GITHUB_ACTOR"
          echo "event: $GITHUB_EVENT_NAME"
      - name: Try to push commit to main using GITHUB_TOKEN
        run: |
          git config --global user.email "attacker-triggered@github-actions.test"
          git config --global user.name "Attacker via issue_comment"
          git clone "https://x-access-token:${{ github.token }}@github.com/hasskoelhadi96-ops/oidc-test-target.git" /tmp/repo
          cd /tmp/repo
          echo "attacker-injected-via-issue-comment-$(date)" > attacker_commit.txt
          git add attacker_commit.txt
          git commit -m "ATTACKER COMMIT via issue_comment contents:write"
          git push origin main 2>&1
          echo "Push result: $?"
