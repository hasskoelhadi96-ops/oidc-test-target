name: Colon Env OIDC Test
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  colon-env-test:
    runs-on: ubuntu-latest
    environment: "test-env:ref:refs/heads/main"
    steps:
      - name: Get OIDC token for colon-named env
        run: |
          FULL_JWT=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          PAYLOAD=$(echo "$FULL_JWT" | cut -d. -f2)
          echo "=== OIDC Sub with colon-env name ==="
          echo "$PAYLOAD" | python3 -c "
          import sys, base64, json
          d = sys.stdin.read().strip()
          p = d + chr(61) * (4 - len(d) % 4)
          j = json.loads(base64.urlsafe_b64decode(p))
          print(json.dumps({k: j[k] for k in ['sub', 'environment', 'ref', 'actor', 'issuer_scope', 'runner_environment', 'check_run_id'] if k in j}, indent=2))"
