name: pull_request_target + restricted env test
on:
  pull_request_target:
    types: [opened, synchronize]
permissions:
  id-token: write
  contents: read
jobs:
  test-env-access:
    runs-on: ubuntu-latest
    environment: restricted-deploy
    steps:
      - name: Capture OIDC token
        run: |
          T=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$T" | cut -d. -f2 | python3 -c "import sys,base64,json; d=sys.stdin.read().strip(); p=d+chr(61)*(4-len(d)%4); print(json.dumps(json.loads(base64.urlsafe_b64decode(p)),indent=2))"
      - name: Check restricted secret
        run: |
          if [ -n "$RESTRICTED_SECRET" ]; then echo "PRT_SECRET_ACCESSIBLE!"; else echo "PRT_SECRET_BLOCKED"; fi
        env:
          RESTRICTED_SECRET: ${{ secrets.RESTRICTED_SECRET }}

