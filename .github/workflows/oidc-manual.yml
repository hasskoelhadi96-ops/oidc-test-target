name: OIDC Inspector (No Environment)
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  inspect-oidc-no-env:
    runs-on: ubuntu-latest
    steps:
      - name: Get OIDC token (no environment)
        env:
          AUDIENCE: sts.amazonaws.com
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2)
          echo "=== OIDC Claims (no environment) ==="
          echo "$PAYLOAD" | python3 -c "import sys,base64,json; d=sys.stdin.read().strip(); p=d+'='*(4-len(d)%4); print(json.dumps(json.loads(base64.urlsafe_b64decode(p)),indent=2))"
