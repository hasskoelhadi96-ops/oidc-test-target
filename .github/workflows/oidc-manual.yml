name: OIDC Token Inspector (Manual)
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  inspect-oidc:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Get OIDC token and inspect claims
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')
          echo "Raw token (decode at jwt.io):"
          echo "$TOKEN"
          echo ""
          echo "=== Decoded payload ==="
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | python3 -m json.tool 2>/dev/null || \
            echo "$TOKEN" | cut -d. -f2 | base64 --decode 2>/dev/null | python3 -m json.tool 2>/dev/null
