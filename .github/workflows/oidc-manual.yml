name: OIDC Inspector
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  inspect-oidc:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Get OIDC token
        env:
          AUDIENCE: sts.amazonaws.com
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          echo "TOKEN_HEADER: $(echo $TOKEN | cut -d. -f1)"
          PAYLOAD=$(echo $TOKEN | cut -d. -f2)
          PAD=$((4 - ${#PAYLOAD} % 4))
          [ $PAD -ne 4 ] && PAYLOAD="${PAYLOAD}$(python3 -c 'print("=" * '$PAD', end="")')"
          echo "$PAYLOAD" | base64 -d 2>/dev/null | python3 -m json.tool
